name: Poka-Yoke Build Gate

# Runs on every push and PR into main. This workflow IS the mistake-proofing
# mechanism: deploy is structurally incapable of running unless both the
# lint job and the secret-scan job succeed. There is no manual override,
# no "skip check" path, and no human approval step that can bypass it.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:

  # ------------------------------------------------------------------
  # JOB 1 — LINT / FORMAT GATE
  # Fails closed on any formatting violation in either the Django (DRF)
  # backend or the React frontend. No warnings-only mode, no continue-on-error.
  # ------------------------------------------------------------------
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python lint tools
        run: pip install black==24.4.2 flake8==7.0.0

      - name: Run black (format check only, no auto-fix)
        run: black --check --diff .

      - name: Run flake8 (style + logic errors)
        run: flake8 . --max-line-length=100 --exclude=migrations,venv

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Run eslint (fail on any warning, not just errors)
        run: npx eslint . --max-warnings=0
        working-directory: ./frontend

  # ------------------------------------------------------------------
  # JOB 2 — SECRET SCAN GATE
  # Fails closed if any hardcoded API key, token, or credential pattern
  # is detected anywhere in the diff or the full repo history of this push.
  # ------------------------------------------------------------------
  secret-scan:
    name: Hardcoded Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks can scan past commits in this push too

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "true"
        # gitleaks-action exits non-zero on any finding by default —
        # that non-zero exit is what halts this job, which in turn
        # blocks the deploy job below via the `needs:` dependency.

  # ------------------------------------------------------------------
  # JOB 3 — DEPLOY
  # This job has no logic of its own that decides whether to deploy.
  # The gate is structural: GitHub Actions will not even start this job
  # unless both `lint` and `secret-scan` report success. That is what
  # "fail-closed" means here — safety is enforced by dependency graph,
  # not by a conditional a developer could accidentally weaken later.
  # ------------------------------------------------------------------
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [lint, secret-scan]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          # Note: credentials are pulled from GitHub Secrets, never
          # committed to the repo — this is itself an example of the
          # rule the secret-scan job above is enforcing.

      - name: Deploy Django backend to App Engine
        run: gcloud app deploy backend/app.yaml --quiet

      - name: Build and deploy React frontend
        run: |
          npm ci
          npm run build
        working-directory: ./frontend
