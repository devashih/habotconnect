name: Poka-Yoke Build Gate

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python lint tools
        run: pip install black==24.4.2 flake8==7.0.0

      - name: Run black (format check only, no auto-fix)
        run: black --check --diff .

      - name: Run flake8 (style + logic errors)
        run: flake8 . --max-line-length=100 --exclude=migrations,venv

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Run eslint (fail on any warning, not just errors)
        run: npx eslint . --max-warnings=0
        working-directory: ./frontend

  secret-scan:
    name: Hardcoded Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "true"

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [lint, secret-scan]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy Django backend to App Engine
        run: gcloud app deploy backend/app.yaml --quiet

      - name: Build and deploy React frontend
        run: |
          npm ci
          npm run build
        working-directory: ./frontend
